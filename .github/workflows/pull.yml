name: Daily pull
on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC daily — after SimpleFIN's ~12:53 UTC Chase refresh (with buffer for jitter)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      # Your category list, not the example — config/categories.yaml is gitignored,
      # so CI only has it via this secret. Fails loudly when unset: a silent
      # fallback to the example had the AI categorizing against the wrong list.
      # A secret (not a variable) so the list stays masked in public run logs.
      - name: Write config/categories.yaml from CATEGORIES_YAML secret
        env:
          CATEGORIES_YAML: ${{ secrets.CATEGORIES_YAML }}
        run: |
          if [ -z "$CATEGORIES_YAML" ]; then
            echo "::error::CATEGORIES_YAML secret is not set. From your checkout: gh secret set CATEGORIES_YAML < config/categories.yaml"
            exit 1
          fi
          printf '%s\n' "$CATEGORIES_YAML" > config/categories.yaml
          python -c "from ledger_one.config import load_categories as l; print(len(l('config/categories.yaml')), 'categories loaded')"
      # 32-day window: wide enough that every still-live pending (incl. ~31-day
      # hotel/rental holds) is re-fetched each run, so the pull's pending
      # reconciliation can trust "absent from feed" = settled/released. Pulling
      # more days is near-free — only genuinely new transactions get categorized.
      - run: python scripts/pull.py --days 32
        env:
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEDGER_CATEGORIZATION_MODEL: claude-sonnet-5-5

  keepalive:
    # GitHub auto-disables scheduled workflows on public repos after 60 days
    # without repo activity — silently, apart from an email. Hitting the enable
    # endpoint resets this workflow's timer. Only ever re-enables itself, so a
    # workflow disabled by hand stays disabled (it never runs to get here).
    # Separate job so actions:write never sits next to the pull job's secrets.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pull.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
